name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tom613951/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run CI checks and tests
        run: |
          node -v
          npm run ci
          node --input-type=module -e "import './lib/index.js'"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          zip="dsh-purge-${version}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-parse "refs/tags/${tag}^{}" 2>/dev/null || true)"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              git tag -f "$tag" "$GITHUB_SHA"
              git push -f origin "refs/tags/$tag"
            fi
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
            test -s "$zip"
            gh release upload "$tag" "$zip" --clobber
            gh release edit "$tag" --title "$tag"
            echo "updated https://github.com/tom613951/dsh-purge/releases/tag/${tag}"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" "$commit"
            gh release create "$tag" --title "$tag" --notes "$tag"
          else
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$tag")
            case "$version" in
              *beta*|*alpha*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r old_tag; do
            [ -n "$old_tag" ] && [ "$old_tag" != "$tag" ] || continue
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done
          echo "published https://github.com/tom613951/dsh-purge/releases/tag/${tag}"
